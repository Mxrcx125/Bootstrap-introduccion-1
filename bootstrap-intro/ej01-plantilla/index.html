<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Ejercicio 1 · Plantilla Bootstrap</title>

  <!-- ============================================================
       EJERCICIO 1 · Plantilla inicial
       ============================================================ -->

  <!-- PASO 2a: meta viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- PASO 2b: CSS de Bootstrap 5.3.8 (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>

<body>

  <!-- PASO 2c: contenedor con título, párrafo y botón -->
  <div class="container py-5">
    <h1 class="display-4 mb-3">¡Hola, Bootstrap!</h1>
    <p class="lead text-secondary mb-4">
      Esta es la plantilla inicial del Ejercicio 1. Bootstrap se carga vía CDN
      y ya aplica sus estilos sobre todos los elementos.
    </p>
    <a href="#" class="btn btn-primary btn-lg">Empezar</a>
  </div>

  <!-- PASO 2d: JS de Bootstrap (bundle con Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- PASO 4: comenta el <link> del CSS (Ctrl + /), guarda y observa qué cambia -->
  <!-- PASO 5: DevTools (F12) → Network → recarga y busca los archivos de Bootstrap -->

  <p><a href="../index.html">← Volver al índice</a></p>
</body>

</html>
